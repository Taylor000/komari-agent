name: Publish supported agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_REPOSITORY: Taylor000/komari-agent

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
            version: "1.2.0"
          - goos: linux
            goarch: loong64
            version: "1.1.93"
        version: ["1.2.0", "1.1.93"]
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ matrix.version }}
        run: |
          BINARY_NAME="komari-agent-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari-agent/update.Repo=${RELEASE_REPOSITORY}" \
            -o "$BINARY_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.2.0", "1.1.93"]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-${{ matrix.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum komari-agent-* > SHA256SUMS

      - name: Create release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Komari Agent $VERSION" \
              --notes "Self-hosted mirror of Komari Agent $VERSION. Binaries update only from $RELEASE_REPOSITORY."
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Mark 1.2.0 as latest
        if: ${{ matrix.version == '1.2.0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "1.2.0" --latest --repo "$GITHUB_REPOSITORY"
